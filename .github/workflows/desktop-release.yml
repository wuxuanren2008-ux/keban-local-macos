name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r desktop/requirements-lock.txt
          npm ci
      - name: Runtime tests
        shell: pwsh
        run: .venv/Scripts/python -m pytest tests/test_local_runtime.py -q
      - name: Build installers
        shell: pwsh
        run: |
          ./scripts/build-desktop.ps1 -SkipInstall
          Get-ChildItem release/*.exe | ForEach-Object { $hash = Get-FileHash $_.FullName -Algorithm SHA256; $hash.Hash.ToLower() + '  ' + $_.Name } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: LectureCompanion-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
