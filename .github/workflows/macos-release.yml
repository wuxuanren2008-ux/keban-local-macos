name: Build and release macOS
on:
  push:
    tags: ['macos-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/macos-validation.yml
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/macos-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-*-installers
          merge-multiple: true
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
